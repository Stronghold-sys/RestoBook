# =========================================================================
# RESTOBOOK ENTERPRISE APACHE SECURITY CONFIGURATION (.htaccess / httpd.conf)
# Salin konfigurasi ini ke file .htaccess di root folder atau konfigurasi vhost
# =========================================================================

# ── 1. SSL & HSTS Enforcement ──────────────────────────────────────────
<IfModule mod_rewrite.c>
    RewriteEngine On
    
    # Paksa HTTPS
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</IfModule>

# ── 2. Security Headers Enforcement ──────────────────────────────────────
<IfModule mod_headers.c>
    # HSTS: Paksa HTTPS selama 1 tahun
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Clickjacking Protection
    Header always set X-Frame-Options "DENY"

    # MIME Sniffing Protection
    Header always set X-Content-Type-Options "nosniff"

    # XSS Protection
    Header always set X-XSS-Protection "1; mode=block"

    # Referrer Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Content Security Policy (CSP)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sandbox.duitku.com https://api.duitku.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://source.unsplash.com https://placehold.co https://dazsblmccvxtewtmaljf.supabase.co https://lh3.googleusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.duitku.com https://sandbox.duitku.com https://accounts.google.com; frame-src https://sandbox.duitku.com https://api.duitku.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';"

    # Permissions Policy
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
</IfModule>

# ── 3. Rate Limiting via mod_ratelimit ──────────────────────────────────
# Catatan: Memerlukan module mod_ratelimit diaktifkan pada Apache
<IfModule mod_ratelimit.c>
    # Batasi download speed untuk API route ke 500 KB/s guna mencegah scraping masal
    <Location /api>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 500
    </Location>
</IfModule>

# ── 4. Proteksi Terhadap Akses File Sensitif ────────────────────────────
<FilesMatch "^\.">
    Order allow,deny
    Deny from all
</FilesMatch>

# Blokir akses ke file konfigurasi dan log
<FilesMatch "\.(sql|log|ini|sh|conf|bak)$">
    Order allow,deny
    Deny from all
</FilesMatch>
