# =========================================================================
# RESTOBOOK ENTERPRISE NGINX SECURITY CONFIGURATION
# Salin snippet ini ke dalam block 'http' dan 'server' di /etc/nginx/nginx.conf
# =========================================================================

# ── 1. HTTP Zone - Letakkan di dalam blok 'http' ──────────────────────────

# Limit zone berdasarkan IP Address (10MB zona memori melacak ~160,000 IP)
# Membatasi total koneksi concurrent dari satu IP
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

# Membatasi rate request global (Public API & Assets)
limit_req_zone $binary_remote_addr zone=global_api_limit:10m rate=60r/m;

# Membatasi rate request khusus rute sensitif (Login, Register, OTP)
limit_req_zone $binary_remote_addr zone=sensitive_auth_limit:10m rate=5r/m;


# ── 2. Server Block - Letakkan di dalam blok 'server' (port 443 SSL) ──────

server {
    listen 443 ssl http2;
    server_name restobookid.my.id;

    # SSL/TLS Enforcement
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security Headers ──────────────────────────────────────────────────
    
    # HSTS: Paksa HTTPS selama 1 tahun (termasuk subdomain & preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Clickjacking Protection
    add_header X-Frame-Options "DENY" always;

    # MIME Sniffing Protection
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sandbox.duitku.com https://api.duitku.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://source.unsplash.com https://placehold.co https://dazsblmccvxtewtmaljf.supabase.co https://lh3.googleusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.duitku.com https://sandbox.duitku.com https://accounts.google.com; frame-src https://sandbox.duitku.com https://api.duitku.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Rate Limiting Enforcement ─────────────────────────────────────────

    # Batasi koneksi concurrent maksimum 10 koneksi per IP
    limit_conn addr_conn_limit 10;

    # Proteksi rute sensitif: Login, Register, OTP, Forgot Password
    location ~* /(login|register|forgot-password|api/auth/login|api/register|api/send-otp|api/reset-password) {
        # Batasi rate ke max 5 request/menit, burst 3 request
        limit_req zone=sensitive_auth_limit burst=3 nodelay;
        
        # Penanganan error rate limit (HTTP 429)
        limit_req_status 429;
        
        # Proxy pass ke Next.js app
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proteksi API Route global
    location /api/ {
        limit_req zone=global_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rute default Next.js App
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
